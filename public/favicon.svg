<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161B24"/>
      <stop offset="100%" stop-color="#0A0C10"/>
    </linearGradient>

    <!-- Keycap Bevel Gradient Normal -->
    <linearGradient id="keycapGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#262E3D"/>
      <stop offset="100%" stop-color="#141821"/>
    </linearGradient>

    <!-- Active Accent Keycap Gradient -->
    <linearGradient id="activeKeyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#397BFF"/>
      <stop offset="100%" stop-color="#1E52C7"/>
    </linearGradient>

    <!-- Border Glow -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#397BFF" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Outer Chassis -->
  <rect x="32" y="32" width="448" height="448" rx="88" fill="url(#bgGrad)" stroke="#252C39" stroke-width="6"/>

  <!-- Inner Recessed Command Deck Plate -->
  <rect x="64" y="64" width="384" height="384" rx="64" fill="#0D0F14" stroke="#191E28" stroke-width="4"/>

  <!-- Row 1: Keycaps -->
  <!-- Top Left Key -->
  <rect x="96" y="96" width="80" height="80" rx="18" fill="url(#keycapGrad)" stroke="#252C39" stroke-width="3"/>
  <rect x="108" y="108" width="56" height="56" rx="10" fill="#181D26" opacity="0.6"/>
  <circle cx="136" cy="136" r="6" fill="#626D7E"/>

  <!-- Top Center Key -->
  <rect x="192" y="96" width="80" height="80" rx="18" fill="url(#keycapGrad)" stroke="#252C39" stroke-width="3"/>
  <rect x="204" y="108" width="56" height="56" rx="10" fill="#181D26" opacity="0.6"/>
  <circle cx="232" cy="136" r="6" fill="#626D7E"/>

  <!-- Top Right Key (Active Focus Deck Key) -->
  <g filter="url(#subtleGlow)">
    <rect x="288" y="96" width="128" height="80" rx="18" fill="url(#activeKeyGrad)" stroke="#5B91FF" stroke-width="3"/>
    <rect x="300" y="108" width="104" height="56" rx="10" fill="#2F6BE6" opacity="0.4"/>
    <!-- Precision command glyph -->
    <path d="M344 136H360M352 128V144" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Row 2: Middle Keycaps -->
  <!-- Key 4 -->
  <rect x="96" y="192" width="80" height="80" rx="18" fill="url(#keycapGrad)" stroke="#252C39" stroke-width="3"/>
  <rect x="108" y="204" width="56" height="56" rx="10" fill="#181D26" opacity="0.6"/>
  <circle cx="136" cy="232" r="6" fill="#626D7E"/>

  <!-- Key 5 (Tactile Center Homing Dot) -->
  <rect x="192" y="192" width="80" height="80" rx="18" fill="url(#keycapGrad)" stroke="#397BFF" stroke-width="3" stroke-opacity="0.8"/>
  <rect x="204" y="204" width="56" height="56" rx="10" fill="#14264A" opacity="0.8"/>
  <circle cx="232" cy="232" r="8" fill="#397BFF"/>
  <circle cx="232" cy="232" r="3" fill="#FFFFFF"/>

  <!-- Key 6 -->
  <rect x="288" y="192" width="80" height="80" rx="18" fill="url(#keycapGrad)" stroke="#252C39" stroke-width="3"/>
  <rect x="300" y="204" width="56" height="56" rx="10" fill="#181D26" opacity="0.6"/>
  <circle cx="328" cy="232" r="6" fill="#626D7E"/>

  <!-- Tall Add/Enter Accent Key (Vertical Keycap) -->
  <rect x="384" y="192" width="32" height="176" rx="14" fill="url(#keycapGrad)" stroke="#252C39" stroke-width="3"/>
  <rect x="390" y="202" width="20" height="156" rx="8" fill="#181D26" opacity="0.6"/>
  <circle cx="400" cy="280" r="5" fill="#626D7E"/>

  <!-- Row 3: Bottom Keycaps -->
  <!-- Key 1 -->
  <rect x="96" y="288" width="80" height="80" rx="18" fill="url(#keycapGrad)" stroke="#252C39" stroke-width="3"/>
  <rect x="108" y="300" width="56" height="56" rx="10" fill="#181D26" opacity="0.6"/>
  <circle cx="136" cy="328" r="6" fill="#626D7E"/>

  <!-- Key 2 -->
  <rect x="192" y="288" width="80" height="80" rx="18" fill="url(#keycapGrad)" stroke="#252C39" stroke-width="3"/>
  <rect x="204" y="300" width="56" height="56" rx="10" fill="#181D26" opacity="0.6"/>
  <circle cx="232" cy="328" r="6" fill="#626D7E"/>

  <!-- Key 3 -->
  <rect x="288" y="288" width="80" height="80" rx="18" fill="url(#keycapGrad)" stroke="#252C39" stroke-width="3"/>
  <rect x="300" y="300" width="56" height="56" rx="10" fill="#181D26" opacity="0.6"/>
  <circle cx="328" cy="328" r="6" fill="#626D7E"/>

  <!-- Bottom Wide Zero Keycap -->
  <rect x="96" y="384" width="176" height="40" rx="14" fill="url(#keycapGrad)" stroke="#252C39" stroke-width="3"/>
  <rect x="106" y="390" width="156" height="28" rx="8" fill="#181D26" opacity="0.6"/>
  <rect x="168" y="401" width="32" height="6" rx="3" fill="#626D7E"/>

  <!-- Decimal Key -->
  <rect x="288" y="384" width="80" height="40" rx="14" fill="url(#keycapGrad)" stroke="#252C39" stroke-width="3"/>
  <circle cx="328" cy="404" r="5" fill="#626D7E"/>

  <!-- Precision Corner Status Indicators -->
  <circle cx="80" cy="80" r="4" fill="#397BFF"/>
  <circle cx="432" cy="80" r="4" fill="#65C991"/>
</svg>
