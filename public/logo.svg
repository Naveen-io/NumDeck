<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" fill="none">
  <defs>
    <linearGradient id="logoActiveKey" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#397BFF"/>
      <stop offset="100%" stop-color="#1E52C7"/>
    </linearGradient>
    <linearGradient id="logoKeycap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#262E3D"/>
      <stop offset="100%" stop-color="#141821"/>
    </linearGradient>
  </defs>

  <!-- Left Icon Mark (48x48) -->
  <g transform="translate(8, 8)">
    <!-- Chassis -->
    <rect x="0" y="0" width="48" height="48" rx="12" fill="#12151C" stroke="#252C39" stroke-width="2"/>
    
    <!-- Mini Keycaps Grid (3x3 representation) -->
    <!-- Row 1 -->
    <rect x="6" y="6" width="10" height="10" rx="2.5" fill="url(#logoKeycap)" stroke="#252C39" stroke-width="1"/>
    <rect x="19" y="6" width="10" height="10" rx="2.5" fill="url(#logoKeycap)" stroke="#252C39" stroke-width="1"/>
    <rect x="32" y="6" width="10" height="10" rx="2.5" fill="url(#logoActiveKey)" stroke="#5B91FF" stroke-width="1"/>
    
    <!-- Row 2 -->
    <rect x="6" y="19" width="10" height="10" rx="2.5" fill="url(#logoKeycap)" stroke="#252C39" stroke-width="1"/>
    <rect x="19" y="19" width="10" height="10" rx="2.5" fill="#14264A" stroke="#397BFF" stroke-width="1"/>
    <circle cx="24" cy="24" r="1.5" fill="#397BFF"/>
    <rect x="32" y="19" width="10" height="23" rx="2.5" fill="url(#logoKeycap)" stroke="#252C39" stroke-width="1"/>
    
    <!-- Row 3 -->
    <rect x="6" y="32" width="23" height="10" rx="2.5" fill="url(#logoKeycap)" stroke="#252C39" stroke-width="1"/>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(68, 16)">
    <!-- Main Title -->
    <text x="0" y="18" fill="#F4F6FA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" letter-spacing="0.08em">NUMPAD<tspan fill="#397BFF">DECK</tspan></text>
    <!-- Subtitle / Architecture -->
    <text x="1" y="32" fill="#626D7E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="600" letter-spacing="0.15em">PRECISION HARDWARE CONTROLLER</text>
  </g>
</svg>
