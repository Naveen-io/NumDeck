[package]
name = "numdeck"
version = "1.2.0"
description = "NumDeck - Turn your ordinary numpad into a customizable Stream Deck-style shortcut controller for Windows"
authors = ["Naveen (https://github.com/Naveen-io)"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[lib]
name = "numdeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-log = "2"
parking_lot = "0.12"
crossbeam-channel = "0.5"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_System_Threading",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemServices",
  "Win32_System_Registry",
] }
